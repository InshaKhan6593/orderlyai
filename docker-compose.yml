services:
  db:
    image: postgres:16-alpine
    container_name: orderlyai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderlyai
      POSTGRES_PASSWORD: orderlyai
      POSTGRES_DB: orderlyai
    ports:
      - "55432:5432"   # 55432 on host → avoids clash with native PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderlyai -d orderlyai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
